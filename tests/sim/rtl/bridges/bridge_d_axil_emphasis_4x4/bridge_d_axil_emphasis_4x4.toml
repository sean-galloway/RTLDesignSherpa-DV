#==============================================================================
# bridge_d_axil_emphasis_4x4.toml
#==============================================================================
# AXIL-emphasis bridge: 2 AXI4 masters + 2 AXIL4 masters into 1 AXI4 + 2 AXIL4
# + 1 APB slaves. Lightweight protocols on both sides. Exercises the AXIL4
# BFM paths heavily — specifically the AXIL4 `base_addr` offset fix from
# v0.1.1 #1 and the AW/W FIFO matching fix from v0.1.1 #2.
#
# Concurrency profile: AXIL4-heavy, mix of AXI4↔AXIL4 conversions
#==============================================================================

[bridge]
name = "bridge_d_axil_emphasis_4x4"
description = "2 AXI4 + 2 AXIL masters → 1 AXI4 + 2 AXIL + 1 APB slaves"
variants = ["no"]

[bridge.clock]
name = "aclk"
frequency_mhz = 100

# ---------------------------------------------------------------- masters ---

[[bridge.masters]]
name       = "cpu_axi4"
prefix     = "cpu_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 4
addr_width = 32
data_width = 64
user_width = 1

[[bridge.masters]]
name       = "dma_axi4"
prefix     = "dma_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 4
addr_width = 32
data_width = 64
user_width = 1

[[bridge.masters]]
name       = "host0_axil"
prefix     = "host0_axil_"
protocol   = "axil"
channels   = "rw"
id_width   = 0
addr_width = 32
data_width = 32
user_width = 1

[[bridge.masters]]
name       = "host1_axil"
prefix     = "host1_axil_"
protocol   = "axil"
channels   = "rw"
id_width   = 0
addr_width = 32
data_width = 32
user_width = 1

# ---------------------------------------------------------------- slaves ----

[[bridge.slaves]]
name       = "ddr0"
prefix     = "ddr0_s_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 6
addr_width = 32
data_width = 128
user_width = 1
base_addr  = "0x00000000"
addr_range = "0x40000000"   # 1 GB

[[bridge.slaves]]
name       = "axil_periph0"
prefix     = "axil_periph0_"
protocol   = "axil"
channels   = "rw"
id_width   = 0
addr_width = 32
data_width = 32
user_width = 1
base_addr  = "0x90000000"
addr_range = "0x00010000"   # 64 KB

[[bridge.slaves]]
name       = "axil_periph1"
prefix     = "axil_periph1_"
protocol   = "axil"
channels   = "rw"
id_width   = 0
addr_width = 32
data_width = 32
user_width = 1
base_addr  = "0x90010000"
addr_range = "0x00010000"   # 64 KB

[[bridge.slaves]]
name       = "apb_periph0"
prefix     = "apb_periph0_"
protocol   = "apb"
channels   = "rw"
id_width   = 0
addr_width = 32
data_width = 32
user_width = 0
base_addr  = "0xA0000000"
addr_range = "0x00010000"   # 64 KB
