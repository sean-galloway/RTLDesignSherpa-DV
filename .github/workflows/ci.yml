name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # This repo shipped 1509 unit tests, `testpaths = ["tests"]` configured and
    # pytest in the dev extra -- and nothing ran them. Two consequences inside one
    # day (2026-09-30): a stale installed copy made tests/unit report 9 failures
    # that did not exist in src/, and a genuine defect (BoardLock refusing its own
    # holder) shipped while the suite was green. Neither would have been caught
    # here. Tracked as issue #82 and RTLDesignSherpa tooling TASK-021.
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # [all,dev] and not [dev]: tests/unit/test_wavedrom_constraints.py imports
      # ortools.sat at MODULE level, so without the `all` extra collection aborts
      # (rc=2) and one error hides all 1509 tests rather than failing loudly.
      - name: Install package and test deps
        run: pip install -e ".[all,dev]"

      # tests/unit only. tests/sim is the tier needing a real simulator on PATH
      # plus RDS_RTL_PATH, and belongs in its own job if it is ever wired up.
      #
      # The editable install matters: it puts direct_url at this tree, which is
      # what lets test_version_single_source compare pip's metadata against
      # CocoTBFramework.__version__ instead of skipping.
      - name: Unit tests
        run: python -m pytest tests/unit -q

  build:
    name: Build & verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[all]"

      - name: Verify imports
        run: |
          python -c "from CocoTBFramework import __version__; print(f'Version: {__version__}')"
          python -c "from CocoTBFramework.components.shared.field_config import FieldConfig; print('FieldConfig: OK')"
          python -c "from CocoTBFramework.components.shared.memory_model import MemoryModel; print('MemoryModel: OK')"
          python -c "from CocoTBFramework.components.shared.flex_randomizer import FlexRandomizer; print('FlexRandomizer: OK')"
          python -c "from CocoTBFramework.components.axi4.axi4_packet import AXI4Packet; print('AXI4Packet: OK')"
          python -c "from CocoTBFramework.components.gaxi import GAXIMaster, GAXISlave, GAXIMonitor; print('GAXI: OK')"
          python -c "from CocoTBFramework.components.apb.apb_packet import APBPacket; print('APBPacket: OK')"
          python -c "from CocoTBFramework.components.fifo.fifo_master import FIFOMaster; print('FIFOMaster: OK')"
          python -c "from CocoTBFramework.components.axis4.axis_master import AXISMaster; print('AXISMaster: OK')"
          python -c "from CocoTBFramework.scoreboards.base_scoreboard import BaseScoreboard; print('BaseScoreboard: OK')"

      - name: Build package
        run: |
          pip install build twine
          python -m build
          twine check dist/*
