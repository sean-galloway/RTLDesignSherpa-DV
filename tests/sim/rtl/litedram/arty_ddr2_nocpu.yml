#
# Modified LiteDRAM config for DDR2 co-sim — based on
# litedram/examples/nexys4ddr.yml. Drops the CPU, keeps Wishbone.
#
# DDR2 phase ratio is 1:2 (vs DDR3/4's 1:4) — exercises the gear
# adapter at a different ratio.
#
# Source: /mnt/data/github/mem-ctrl-ref/litedram/examples/nexys4ddr.yml
# License: BSD-2-Clause
{
    "speedgrade": -1,
    "cpu":        "None",
    "memtype":    "DDR2",
    "uart":       "stub",

    "cmd_latency":     0,
    "sdram_module":    "MT47H64M16",
    "sdram_module_nb": 2,
    "sdram_rank_nb":   1,
    "sdram_phy":       "A7DDRPHY",

    "input_clk_freq":   100e6,
    "sys_clk_freq":     100e6,
    "iodelay_clk_freq": 200e6,

    "cmd_buffer_depth": 16,

    "user_ports": {
        "wishbone_0" : {
            "type":  "wishbone",
            "block_until_ready": True,
        },
    },
}
