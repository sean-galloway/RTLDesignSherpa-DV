[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cocotb-framework"
# The version is READ FROM src/CocoTBFramework/__init__.py -- see
# [tool.setuptools.dynamic] below. It used to be a literal here as well, and the
# two drifted for six releases: the published 0.6.7 wheel shipped
# __version__ = "0.6.1" while its own METADATA said 0.6.7, so anything asking the
# package its version got an answer three releases stale. One source now.
# tooling TASK-021.
dynamic = ["version"]
description = "Reusable CocoTB verification infrastructure for RTL testing — BFMs, testbenches, and scoreboards for AMBA protocols and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "sean galloway" },
]
keywords = [
    "cocotb", "verification", "rtl", "fpga", "asic",
    "axi", "apb", "amba", "bfm", "testbench",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: cocotb",
    "Intended Audience :: Developers",
"Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    # cocotb is deliberately NOT capped here. The framework itself has not been
    # shown incompatible with cocotb 2.x, and capping the core would forbid any
    # consumer pairing it with cocotb 2 plus cocotb's own native runner. The
    # real incompatibility is cocotb-test <-> cocotb 2.x, so the cap lives in
    # the [sim] extra below, where cocotb-test is declared.
    "cocotb>=1.9.0",
    # cocotb-bus is NO LONGER capped (2026-10-01). The previous cap said the
    # 0.2.x `_add_signal` case-sensitivity asymmetry was "load-bearing in
    # apb_components". That was the wrong word and it cost a release: the
    # framework does not DEPEND on the asymmetry, it WORKS AROUND it.
    # `APBSignalMixin._match_optional_case` exists precisely because 0.2.x gates
    # optional signals on a case-SENSITIVE `hasattr`, so a lowercase-port DUT
    # silently loses PSTRB/PPROT/PSLVERR -- writes go out with zero byte strobes
    # and the register just reads back its reset value.
    #
    # 0.3.0 FIXES that upstream (optional signals now go through
    # `_caseInsensGetattr`), so the workaround becomes redundant rather than
    # broken -- it returns exact matches unchanged.
    #
    # Measured before lifting, on the APB suite that the cap was protecting,
    # cocotb 1.9.2 both sides: 0.2.1 -> 45 passed, 0.3.0 -> 45 passed.
    # 0.3.0 is also REQUIRED for any cocotb 2.x work: 0.2.1's
    # `cocotb_bus/drivers/__init__.py` imports `cocotb.decorators`, which 2.x
    # removed. Note 0.3.0 declares a `scapy` dependency; nothing on the
    # driver/monitor/bus path this framework uses imports it.
    "cocotb-bus>=0.2.1",
    # cocotb-coverage 2.0 validated on cocotb 2.1.0 (tooling TASK-029,
    # 2026-10-06): decorator/class surface unchanged (CoverageDB, CoverPoint,
    # CoverCross, coverage_section, merge_coverage, reportCoverage), XML/YML
    # export exercised, BKM val/cdc COVERAGE=1 run green with the identical
    # artifact set. The <2 cap was protecting the pre-2.x pin era only.
    "cocotb-coverage>=1.2.0",
    "rich>=14.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
wavedrom = ["ortools>=9.12.0"]
all = [
    "ortools>=9.12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]
# Tier 2 sim tests (cocotb harness with real simulator). Install with:
#   pip install -e ".[sim]"
# Plus you need a Verilog simulator on PATH (verilator recommended) and
# either RDS_RTL_PATH set or tests/sim/_rds/ submodule initialized.
sim = [
    # cocotb-test must be >= 0.3.0, and that requirement REPLACES capping cocotb.
    # 0.2.5 does `import cocotb.config`, which cocotb 2.x removed, so installing
    # this extra alongside cocotb 2.x made every cocotb_test-based test fail at
    # COLLECTION with "No module named 'cocotb.config'" -- an error that names
    # the test file and never mentions cocotb-test, so it reads as a broken repo
    # rather than a dependency conflict. It cost a consuming repo a tree-wide
    # outage on 2026-09-30.
    #
    # 0.3.0 (2026-09-23) fixes it at the source: no cocotb.config reference
    # anywhere, replaced by cocotb_test.compat (cocotb_2x_or_newer,
    # cocotb_config). It declares only cocotb>=1.5 and the shim works on cocotb
    # 1.x too, so requiring it is strictly better than a `cocotb<2` cap -- the
    # conflict is gone rather than constrained around, and consumers stay free to
    # pair this framework with cocotb 2 and cocotb's own native runner.
    "cocotb-test>=0.3.0",      # cocotb_test.simulator.run
    "pytest-xdist>=3.5",       # parallel test execution (ptwp alias)
    "pytest-asyncio>=0.23",    # async test support some cocotb tests use
    "pytest-rerunfailures>=14", # flake retry for long sim regressions
    "GitPython>=3.1",          # TBClasses.shared.utilities.get_repo_root
    "tomli>=2.0; python_version < '3.11'",  # tomllib backport for TOML parsing
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://sean-galloway.github.io/RTLDesignSherpa-DV/"
Documentation = "https://sean-galloway.github.io/RTLDesignSherpa-DV/"
Repository = "https://github.com/sean-galloway/RTLDesignSherpa-DV"
Issues = "https://github.com/sean-galloway/RTLDesignSherpa-DV/issues"

[tool.setuptools.dynamic]
# Read statically from the module's literal -- setuptools parses the assignment
# without importing the package, so this works in a source tree and needs no
# fallback. The alternative (importlib.metadata inside __init__.py) would make
# __version__ depend on the package being INSTALLED, and this repo's own tests
# import from src/ rather than an installed copy.
version = {attr = "CocoTBFramework.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py files are NOT installed unless declared here -- setuptools ships only
# modules by default. Without this the jedec/ CSVs were dropped from every
# installed build, so `builtin_timings("ddr2-650-mt47h64m16hr")` raised
# FileNotFoundError pointing into site-packages. It worked from a source
# checkout, which is why it went unnoticed.
#
# jedec/ has no __init__.py, so it is not a discovered package and cannot be a
# key here; the data is declared on its parent with a path glob instead.
# `builtin_timings` resolves Path(__file__).parent / "jedec", so the files must
# land beside the module -- which is exactly what this does.
[tool.setuptools.package-data]
"CocoTBFramework.components.dfi" = ["jedec/*.csv", "jedec/*.md", "jedec/*.example"]
"CocoTBFramework.components.axi4" = ["*.md"]
"CocoTBFramework.components.uart" = ["*.md"]
"CocoTBFramework.components.ace" = ["*.md"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line-too-long — inherited from source, not worth reformatting
    "E722",   # bare-except — inherited patterns
    "F821",   # undefined-name — forward refs and conditional imports
    "F601",   # multi-value-repeated-key-literal — intentional in configs
    "F402",   # import-shadowed-by-loop-var — inherited patterns
    "E731",   # lambda-assignment — inherited patterns
]

[tool.pytest.ini_options]
testpaths = ["tests"]
