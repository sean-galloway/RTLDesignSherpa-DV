# CocoTB Framework — PDF book styles
#
# Reuses the RTL Design Sherpa corporate template verbatim (fonts, colors,
# heading rules, tables, headers/footers, margins) so these BFM books render
# consistent with the RTL library PDFs. Only the title_page and the per-book
# __TITLE__/__SUBTITLE__/__LOT__/__LOF__/__LOW__ placeholders are substituted
# at build time by generate_pdfs.sh.

company:
  name: "RTL Design Sherpa"
  confidential_text: "Open Source - MIT License"

colors:
  primary: "#228B22"      # Forest green
  secondary: "#404040"    # Dark gray
  light_gray: "#808080"   # Light gray for captions
  white: "#FFFFFF"
  black: "#000000"

fonts:
  main: "Calibri"
  mono: "Consolas"
  heading: "Calibri"

headings:
  h1:
    font_size: 16
    color: white
    background: secondary
    bold: true
    space_before: 18
    space_after: 6
  h2:
    font_size: 14
    color: primary
    bold: true
    underline_color: primary
    space_before: 14
    space_after: 4
  h3:
    font_size: 12
    color: secondary
    bold: true
    space_before: 10
    space_after: 4
  h4:
    font_size: 11
    color: secondary
    bold: true
    italic: true
    space_before: 8
    space_after: 4

body:
  font_size: 10
  line_spacing: 1.15
  space_after: 6

tables:
  header:
    background: "#E0E0E0"
    color: black
    bold: true
    font_size: 10
  body:
    font_size: 10
    alternate_rows: false
    alternate_color: "#F5F5F5"

captions:
  table:
    font_size: 9
    italic: true
    color: light_gray
    prefix: "Table"
  figure:
    font_size: 9
    italic: true
    color: light_gray
    prefix: "Figure"

header_footer:
  enabled: true
  header_text: ""
  footer_left: "{title} {version}"
  footer_center: "{confidential}"
  footer_right: "{page}"
  font_size: 8

margins:
  top: 1.0
  bottom: 1.0
  left: 0.75
  right: 0.75

# Substituted per book by generate_pdfs.sh (build_book). For the
# DOCX -> LibreOffice -> PDF route, THIS block enables the lists;
# md_to_docx.py reads lists_config from the style only.
lists:
  lot: __LOT__    # List of Tables
  lof: __LOF__    # List of Figures
  low: __LOW__    # List of Waveforms

# Logo path is relative to this YAML's directory (docs/).
title_page:
  enabled: true
  logo: "logos/Logo_400px.png"
  logo_width: 2.5
  company: "RTL Design Sherpa"
  title: "__TITLE__"
  subtitle: "__SUBTITLE__"
  date: "July 2026"
  company_color: primary
  title_color: secondary
  company_size: 20
  title_size: 20
  date_size: 16
